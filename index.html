<!DOCTYPE html>
<html>
<body>
<script>
function receiveMessage(msg) {
  fetch(msg)
    .then(r => r.blob())
    .then(blob => {
      var reader = new FileReader();
      reader.onloadend = function() {
        var base64 = reader.result.split(",")[1];
        fetch("TU_URL_APPS_SCRIPT", {
          method: "POST",
          body: JSON.stringify({image: base64, filename: "foto.jpg"})
        })
        .then(r => r.text())
        .then(resp => {
          window.ReactNativeWebView.postMessage(resp);
        });
      };
      reader.readAsDataURL(blob);
    })
    .catch(function(err) {
      window.ReactNativeWebView.postMessage("ERROR:" + err.message);
    });
}
</script>
</body>
</html>
